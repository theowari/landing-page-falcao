# Gera o build (dist/) e publica no GitHub Pages a cada push no branch ShadCN.
# O Pages só entrega arquivos prontos; as ilhas em src/islands/*.tsx só funcionam depois do build.
name: Publicar no GitHub Pages

on:
  push:
    branches: [ShadCN]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # o site fica em theowari.github.io/landing-page-falcao/
          VITE_BASE: /landing-page-falcao/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
